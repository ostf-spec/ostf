# SPDX-License-Identifier: Apache-2.0
name: OSTF check
description: Run the OSTF 0.3 check, upload its result as SARIF, and fail on an error or a suspect or broken link, and in strict mode on an unstamped link or a missing lock.
author: OSTF contributors
branding:
  icon: link
  color: blue
inputs:
  root:
    description: Directory that holds trace.yaml, relative to the workspace.
    default: "."
  base:
    description: Base branch for impact (Annex C.3). Defaults to the pull request's base branch; empty outside pull requests. With a base, the Action fetches the full history, which change information reads (Annex I.3).
    default: ""
  sarif:
    description: Upload the SARIF result to GitHub code scanning, which needs the security-events write permission.
    default: "true"
  strict:
    description: Run check --strict (Annex I.1), which also fails on an unstamped link or a missing lock. auto turns it on when the base branch has a lock file in this root, trace.lock or an item file's lock (OSTF-142), so a change that loses or empties the lock fails. It learns that from impact.lock (Annex C.3), so with a base branch auto runs the check twice. true or false sets it.
    default: "auto"
outputs:
  exit-code:
    description: The exit code of ostf check, 0 when it passes.
    value: ${{ steps.check.outputs.exit-code }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Install the OSTF reader
      shell: bash
      run: python -m pip install --disable-pip-version-check --quiet "$GITHUB_ACTION_PATH"
    - name: Run ostf check
      id: check
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        BASE: ${{ inputs.base || github.base_ref }}
        STRICT: ${{ inputs.strict }}
      run: |
        set +e
        args=()
        if [ "$STRICT" != auto ] && [ "$STRICT" != true ] && [ "$STRICT" != false ]; then
          echo "ostf: strict is auto, true or false, not $STRICT" >&2
          echo "exit-code=2" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ -n "$BASE" ]; then
          # Change information walks the first-parent history (Annex I.3), which a shallow checkout lacks:
          # fetch it whole, and the base branch with it, so no commit at the edge of a clone is named.
          if [ "$(git rev-parse --is-shallow-repository)" = true ] && ! git fetch --no-tags --unshallow origin; then
            echo "ostf: cannot fetch the history, so the check cannot run" >&2
            echo "exit-code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"; then
            echo "ostf: cannot fetch the base branch $BASE, so the check cannot run" >&2
            echo "exit-code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--base "origin/$BASE")
          # impact.lock is kept or removed when the base view holds a lock file, wherever it is (Annex C.3).
          if [ "$STRICT" = auto ]; then
            lock=$(ostf check "${args[@]}" --format json | python -c 'import json, sys; print(json.load(sys.stdin).get("impact", {}).get("lock", ""))')
            if [ "$lock" = kept ] || [ "$lock" = removed ]; then
              STRICT=true
            fi
          fi
        fi
        if [ "$STRICT" = true ]; then
          args+=(--strict)
        fi
        ostf check "${args[@]}"
        status=$?
        ostf check --format sarif > "$RUNNER_TEMP/ostf.sarif"
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
    - name: Upload SARIF
      if: inputs.sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ runner.temp }}/ostf.sarif
        category: ostf
    - name: Fail on findings
      shell: bash
      run: exit "${{ steps.check.outputs.exit-code }}"
