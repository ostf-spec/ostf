# SPDX-License-Identifier: Apache-2.0
name: Draft conformance checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Run standalone draft checks
        run: python3 conformance/run.py
  schema-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Check structural schema fixtures
        run: go test ./...
      - name: Vet Go code
        run: go vet ./...
      - name: Check worked example
        run: cd examples/minimal && go test ./...
      - name: Check payment retry scenario
        run: cd examples/payment-retry && go test ./...
